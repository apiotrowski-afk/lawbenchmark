weryfikacja: >
  Przepisy sprawdzone 2026-10-10 w tekście jednolitym i nowelach po t.j. Sąd
  Najwyższy nie wypowiedział się wprost o relacji wstrzymania wykonania (§ 3)
  do tytułu zabezpieczenia (§ 1); w SAOS znaleziono tylko postanowienie SO
  w Szczecinie VIII Gz 43/16 (stan faktyczny: nakaz bez weksla, ale teza
  sformułowana ogólnie). Niesprawdzone: komentarze (wg omówień D. Zawistowski
  przyjmuje ten sam pogląd), ewentualny pogląd przeciwny w doktrynie oraz praktyka
  sądów, które we wstrzymaniu wykonania wprost obejmują zabezpieczenie.
  `sporne: false` do potwierdzenia przez Adama.
