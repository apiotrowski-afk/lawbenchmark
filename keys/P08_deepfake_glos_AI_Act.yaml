status: "zatwierdzony przez Adama 2026-10-18 (v4: rdzeń wg wytycznych KE C(2026) 5054 — decyduje obiektywna możliwość wzięcia za autentyczne, kryterium „istniejące” obejmuje osoby mogące realnie istnieć; nowy element rubryki za odwołanie do wytycznych KE z zaznaczeniem soft law)"
# v4 (2026-10-18, decyzja Adama po przeglądzie bazy /aiakt #222–#224): (1) rdzeń doprecyzowany wg wytycznych KE
#   C(2026) 5054 z 20.07.2026 (cztery kumulatywne kryteria; „istniejące” = istniejące albo mogące realnie istnieć;
#   głos postaci fikcyjnej bez wprowadzania w błąd co do tożsamości — nie deepfake); (2) R6: odwołanie do wytycznych
#   z zaznaczeniem, że to soft law — element rubryki, NIE kara (zasada README „Soft law w kluczach”); (3) status wytycznych
#   na datę stanu prawnego: zatwierdzona treść projektu, formalne przyjęcie po wersjach językowych (komunikat KE, #224);
#   nazwanie ich „przyjętymi 20.07.2026” nie jest halucynacją (tak piszą kancelarie, strona KE niejednoznaczna);
#   błędem jest dopiero przypisanie im mocy wiążącej. Punkty możliwe A +1 (R 5→6).
# v3 (2026-10-10): element „rozwidlenie” (dopytanie jako równorzędna strategia) w trzecim elemencie rubryki wg README „B2 — kalibracja / Dopytanie” (decyzja Adama); punkty możliwe bez zmian. v2: 2026-10-10.
# v2 (2026-10-10): pola kalibracja_oczekiwana (warunkowa) i warunek (decyzja Adama, README „B2 — kalibracja”);
#   rdzeń, rubryka i punktacja bez zmian. v1: 2026-10-03.
data_stanu_prawnego: 2026-10-01
typ: weryfikacja
pulapka: true
domena: ai
tekst_oryginalny: "Treścią typu deepfake nie będzie głos wygenerowany przez AI, który niczego nie udaje i w żaden sposób nie wprowadza w błąd.  czy to prawda na gruncie AI Act?"

rdzen: >
  W zasadzie tak, co do samej definicji: deepfake to treść, która przypomina
  istniejące osoby, przedmioty, miejsca, podmioty lub zdarzenia i którą odbiorca
  mógłby niesłusznie uznać za autentyczną lub prawdziwą (art. 3 pkt 60). Decyduje
  obiektywna możliwość wzięcia za autentyczne, nie zamiar ani to, czy głos „udaje”
  konkretną osobę — według wytycznych KE (C(2026) 5054, soft law) kryterium „istniejące”
  obejmuje też osoby, które mogą realnie istnieć, więc realistyczny syntetyczny głos
  może być deepfake, jeśli odbiorca mógłby go wziąć za nagranie prawdziwego człowieka.
  Głos, którego nie da się wziąć za autentyczny, nie jest deepfake, więc nie powstaje
  obowiązek ujawnienia z art. 50 ust. 4.
  Nie oznacza to jednak braku obowiązków: dostawca systemu generującego
  syntetyczny dźwięk musi oznakować wynik w formacie do odczytu maszynowego
  (art. 50 ust. 2) niezależnie od tego, czy treść jest deepfake.
pulapka_opis: >
  Przesłanka jest częściowo prawdziwa. Pułapka polega na przeniesieniu wniosku
  „to nie deepfake” na „AI Act nic nie wymaga”. Druga pułapka: kryterium definicji
  to podobieństwo do istniejącego bytu i możliwość wzięcia za autentyczne, a nie
  intencja wprowadzenia w błąd.

podstawy_wymagane:
  - art. 3 pkt 60 AI Act
  - art. 50 ust. 2 AI Act
  - art. 50 ust. 4 AI Act
podstawy_dopuszczalne:
  - art. 113 (stosowanie od 2.08.2026) i art. 111 ust. 4 (systemy wprowadzone przed 2.08.2026 — zgodność z art. 50 ust. 2 do 2.12.2026), oba w brzmieniu po rozporządzeniu (UE) 2026/1744
  - motywy 133–134
  - wytyczne KE C(2026) 5054 z 20.07.2026 w sprawie obowiązków przejrzystości z art. 50 (soft law; na datę stanu prawnego zatwierdzona treść projektu, formalne przyjęcie po wersjach językowych) — m.in. cztery kumulatywne kryteria deepfake, „istniejące” = mogące realnie istnieć, przykład: głos postaci fikcyjnej bez wprowadzania w błąd co do tożsamości nie jest deepfake
  - kodeks praktyk dotyczący przejrzystości treści generowanych przez AI (czerwiec 2026; uznany za adekwatny przez KE i Radę ds. AI 8–9.07.2026) — oznakowanie audio: podpisane metadane, znaki wodne

wzorce_cytatow:
  aiact_3_60:
    brzmienie: "„deepfake” oznacza wygenerowane przez AI lub zmanipulowane przez AI obrazy, treści dźwiękowe lub treści wideo, które przypominają istniejące osoby, przedmioty, miejsca, podmioty lub zdarzenia, które odbiorca mógłby niesłusznie uznać za autentyczne lub prawdziwe;"
    zrodlo: EUR-Lex CELEX 02024R1689-20260727 (tekst skonsolidowany)
  aiact_50_2_zd1:
    brzmienie: "Dostawcy systemów AI, w tym systemów AI ogólnego zastosowania, generujących treści w postaci syntetycznych dźwięków, obrazów, wideo lub tekstu, zapewniają, aby wyniki systemu AI zostały oznakowane w formacie nadającym się do odczytu maszynowego i były wykrywalne jako sztucznie wygenerowane lub zmanipulowane."
    zrodlo: EUR-Lex CELEX 02024R1689-20260727
  aiact_50_4_zd1:
    brzmienie: "Podmioty stosujące system AI, który generuje obrazy, treści audio lub wideo stanowiące treści deepfake lub który manipuluje takimi obrazami lub treściami, ujawniają, że treści te zostały sztucznie wygenerowane lub zmanipulowane."
    zrodlo: EUR-Lex CELEX 02024R1689-20260727

rubryka:
  - przytacza albo poprawnie parafrazuje dwa elementy definicji (podobieństwo do istniejącego bytu i możliwość niesłusznego uznania za autentyczne)
  - zauważa, że kryterium nie jest intencja wprowadzenia w błąd
  - "rozwidlenie: wskazuje obowiązek dostawcy z art. 50 ust. 2 niezależny od statusu deepfake, ALBO dopytuje, czy pytanie dotyczy samej definicji, czy obowiązków wobec takiego głosu"
  - rozdziela adresatów: ust. 2 dostawca, ust. 4 podmiot stosujący
  - podaje datę stosowania art. 50 (2.08.2026) albo termin z art. 111 ust. 4 (2.12.2026)
  - odwołuje się do wytycznych KE do art. 50 (albo kodeksu praktyk) z zaznaczeniem, że to soft law (niewiążące), w szczególności do wykładni kryterium „istniejące” (osoby mogące realnie istnieć) albo do kryterium obiektywnej możliwości wzięcia za autentyczne
kary:
  - wniosek, że AI Act nie nakłada żadnych obowiązków na taki głos
  - przypisuje oznakowanie maszynowe podmiotowi stosującemu albo ujawnienie z ust. 4 dostawcy
  - podaje 2.02.2027 jako termin z art. 111 ust. 4 (stan z projektu Omnibusa, nieprzyjęty)

sporne: false
kalibracja_oczekiwana: warunkowa
warunek: "„tak” tylko co do definicji deepfake (art. 3 pkt 60 AI Act) i obowiązku z art. 50 ust. 4; obowiązek oznakowania maszynowego dostawcy z art. 50 ust. 2 istnieje niezależnie"

